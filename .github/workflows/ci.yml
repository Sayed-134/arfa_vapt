name: ARFA CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare payload database
        run: |
          git clone --depth 1 https://github.com/swisskyrepo/PayloadsAllTheThings.git \
            payloads-database/PayloadsAllTheThings-master
      - name: Install Python dependencies
        run: python -m pip install -r ai-engine/requirements.txt
      - name: Go build and static checks
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Python tests
        run: PYTHONPATH=ai-engine python -m pytest -v ai-engine/tests
      - name: Authorized local end-to-end regression
        run: PYTHON_BIN=python scripts/run_e2e_regression.sh
